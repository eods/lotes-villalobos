<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Lotes Villalobos</title>
<meta name="theme-color" content="#0b5f8a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lotes">
<style>
  :root {
    --azul: #0b5f8a;
    --fondo: #f3f5f7;
    --panel: #ffffff;
    --texto: #1b2430;
    --suave: #64707d;
    --marca: #ff3b30;
    --borde: #d9dee4;
    --resalte: #e8f2f8;
  }
  @media (prefers-color-scheme: dark) {
    :root { --fondo: #12171d; --panel: #1c232b; --texto: #e8edf2; --suave: #9aa6b2; --borde: #2c3640; --resalte: #23313d; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--fondo); color: var(--texto);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  body { display: flex; flex-direction: column; }

  header { background: var(--azul); color: #fff; padding: calc(env(safe-area-inset-top) + 10px) 16px 12px; }
  .titulo { display: flex; align-items: center; justify-content: space-between; margin: 0 0 8px; }
  header h1 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: .3px; }
  #candado { background: transparent; color: #fff; font-size: 18px; padding: 2px 6px; display: none; }
  #filtro { display: flex; gap: 4px; margin: 0 0 8px; padding: 3px; background: rgba(255,255,255,.15); border-radius: 10px; }
  #filtro button { flex: 1; font-size: 14px; padding: 7px 4px; border-radius: 8px; background: transparent; color: #fff; }
  #filtro button.on { background: #fff; color: var(--azul); }
  #buscar { display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; font-size: 18px; padding: 10px 14px; border: 0; border-radius: 10px;
    background: #fff; color: #1b2430; outline: none; }
  button { font-size: 16px; font-weight: 600; padding: 10px 16px; border: 0; border-radius: 10px;
    background: #fff; color: var(--azul); cursor: pointer; }
  button:active { transform: scale(.97); }

  #visor { position: relative; flex: 1; overflow: hidden; touch-action: none; background: #e9ecef; }
  #lienzo { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #lienzo.anim { transition: transform .45s ease; }
  #lienzo img { position: absolute; display: block; user-select: none; -webkit-user-drag: none; pointer-events: none; }
  .nombreBarrio { position: absolute; text-align: center; font-size: 44px; font-weight: 800; letter-spacing: 6px;
    color: var(--azul); pointer-events: none; }

  .marca { position: absolute; width: 0; height: 0; display: none; z-index: 3; }
  .marca.on { display: block; }
  .marca .aro { position: absolute; left: -22px; top: -22px; width: 44px; height: 44px; border-radius: 50%;
    border: 4px solid var(--marca); box-shadow: 0 0 0 3px rgba(255,255,255,.85); animation: pulso 1.4s ease-out infinite; }
  .marca .pin { position: absolute; left: -16px; top: -62px; width: 32px; height: 40px; }
  @keyframes pulso { 0% { transform: scale(.7); opacity: 1; } 100% { transform: scale(1.6); opacity: .15; } }
  .punto { position: absolute; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%;
    background: rgba(255,59,48,.8); border: 1px solid #fff; font-size: 9px; }
  .punto span { position: absolute; left: 8px; top: -4px; color: #000; background: #ffeb3b; padding: 0 2px; }

  /* Nombres de propietarios sobre el plano (en píxeles del plano, escalan con el zoom) */
  #etiquetas { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
  #etiquetas.off { display: none; }
  .etiqueta { position: absolute; transform: translate(-50%, 9px); max-width: 60px; padding: 0 2px;
    font-size: 6.5px; line-height: 1.25; font-weight: 600; color: #fff; background: rgba(11,95,138,.88);
    border-radius: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  #ficha { position: absolute; left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom) + 12px); z-index: 5;
    background: var(--panel); border: 1px solid var(--borde); border-radius: 14px; padding: 12px 16px;
    box-shadow: 0 6px 24px rgba(0,0,0,.18); display: none; max-width: 480px; margin: 0 auto; }
  #ficha.on { display: block; }
  .fila { display: flex; align-items: center; gap: 14px; }
  #ficha .num { font-size: 30px; font-weight: 700; color: var(--azul); line-height: 1; }
  #ficha .det { flex: 1; min-width: 0; font-size: 14px; color: var(--suave); }
  #ficha .det b { color: var(--texto); font-size: 16px; }
  #fProp { color: var(--texto); font-weight: 600; overflow-wrap: anywhere; }
  #ficha.error .num { color: var(--marca); font-size: 18px; }
  #btnEditar { font-size: 14px; padding: 8px 12px; background: var(--azul); color: #fff; display: none; }
  #btnLlegar { display: none; margin-top: 10px; padding: 10px; border-radius: 10px; text-align: center;
    font-size: 15px; font-weight: 600; text-decoration: none; color: #fff; background: #1a73e8; }
  #btnLlegar.on { display: block; }
  #edicion { display: none; margin-top: 10px; gap: 8px; }
  #edicion.on { display: flex; }
  #edicion input { font-size: 16px; padding: 8px 10px; border: 1px solid var(--borde); }
  #edicion button { font-size: 14px; padding: 8px 12px; background: var(--azul); color: #fff; }
  #edicion button.sec { background: transparent; color: var(--suave); padding: 8px 6px; }
  #fMsg { font-size: 12px; color: var(--marca); margin-top: 6px; display: none; }

  #resultados { position: absolute; left: 12px; right: 64px; top: 12px; z-index: 6; max-width: 480px; margin: 0 auto;
    background: var(--panel); border: 1px solid var(--borde); border-radius: 14px; box-shadow: 0 6px 24px rgba(0,0,0,.18);
    display: none; max-height: 60%; overflow: auto; }
  #resultados.on { display: block; }
  #resultados .cab { padding: 10px 14px; font-size: 13px; color: var(--suave); border-bottom: 1px solid var(--borde);
    display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: var(--panel); }
  #resultados .cab button { background: transparent; color: var(--suave); padding: 0 4px; font-size: 20px; }
  #resultados .op { display: flex; gap: 10px; align-items: baseline; width: 100%; text-align: left; border-radius: 0;
    padding: 12px 14px; background: transparent; color: var(--texto); font-weight: 400; border-bottom: 1px solid var(--borde); }
  #resultados .op:last-child { border-bottom: 0; }
  #resultados .op:active { background: var(--resalte); }
  #resultados .op b { color: var(--azul); min-width: 34px; }
  #resultados .op .barrio { font-size: 12px; font-weight: 600; color: var(--suave); text-transform: uppercase; letter-spacing: .5px; }
  #resultados .op .prop { flex: 1; min-width: 0; overflow-wrap: anywhere; }

  #controles { position: absolute; right: 12px; top: 12px; display: flex; flex-direction: column; gap: 8px; z-index: 4; }
  #controles button { width: 42px; height: 42px; padding: 0; font-size: 22px; background: var(--panel); color: var(--texto);
    border: 1px solid var(--borde); box-shadow: 0 2px 8px rgba(0,0,0,.12); }
  #controles button.activo { background: var(--azul); color: #fff; }
  #verNombres { display: none; font-size: 18px !important; }
  #ayuda { position: absolute; left: 12px; top: 12px; font-size: 12px; color: #33414f; background: rgba(255,255,255,.85);
    padding: 4px 8px; border-radius: 8px; pointer-events: none; z-index: 4; }
  #editor { display: none; position: absolute; left: 12px; top: 40px; background: #fff3cd; color: #5c4400; z-index: 4;
    padding: 6px 10px; border-radius: 8px; font-size: 12px; }
  #editor button { font-size: 12px; padding: 4px 8px; margin-left: 6px; background: #5c4400; color: #fff; }

  dialog { border: 0; border-radius: 14px; padding: 18px; width: min(320px, 90vw); background: var(--panel); color: var(--texto); }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  dialog h2 { margin: 0 0 12px; font-size: 17px; }
  dialog input { width: 100%; border: 1px solid var(--borde); font-size: 16px; }
  dialog .acciones { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  dialog .acciones button { font-size: 15px; padding: 8px 14px; background: var(--azul); color: #fff; }
  dialog .acciones button.sec { background: transparent; color: var(--suave); }
  #dMsg { color: var(--marca); font-size: 13px; margin-top: 8px; min-height: 1em; }
</style>
</head>
<body>
<header>
  <div class="titulo">
    <h1>Buscador de lotes</h1>
    <button id="candado" type="button" aria-label="Habilitar edición" title="Habilitar edición">🔒</button>
  </div>
  <div id="filtro" role="group" aria-label="Barrio">
    <button type="button" data-b="T">Todos</button>
    <button type="button" data-b="V">Villalobos</button>
    <button type="button" data-b="M">Magallanes</button>
  </div>
  <form id="buscar" autocomplete="off">
    <input id="lote" type="search" enterkeyhint="search" placeholder="N° de lote" aria-label="Lote o propietario">
    <button type="submit">Buscar</button>
  </form>
</header>

<div id="visor">
  <div id="lienzo">
    <div id="etiquetas"></div>
    <div class="marca" id="marca">
      <div class="aro"></div>
      <svg class="pin" viewBox="0 0 32 40"><path d="M16 0C7.2 0 0 7 0 15.6 0 27.3 16 40 16 40s16-12.7 16-24.4C32 7 24.8 0 16 0z" fill="#ff3b30" stroke="#fff" stroke-width="2"/><circle cx="16" cy="15" r="6" fill="#fff"/></svg>
    </div>
  </div>
  <div id="ayuda">Tocá un lote del plano o buscá por número</div>
  <div id="editor">Modo edición: tocá el plano para mover el lote buscado
    <button id="exportar" type="button">Copiar JSON</button></div>
  <div id="controles">
    <button id="mas" type="button" aria-label="Acercar">+</button>
    <button id="menos" type="button" aria-label="Alejar">−</button>
    <button id="todo" type="button" aria-label="Ver plano completo">⤢</button>
    <button id="verNombres" type="button" class="activo" aria-label="Mostrar u ocultar propietarios" title="Propietarios">👤</button>
  </div>
  <div id="resultados"></div>
  <div id="ficha">
    <div class="fila">
      <div class="num" id="fNum"></div>
      <div class="det" id="fDet"></div>
      <button id="btnEditar" type="button">Editar</button>
    </div>
    <a id="btnLlegar" target="_blank" rel="noopener">📍 Cómo llegar con Google Maps</a>
    <form id="edicion" autocomplete="off">
      <input id="eProp" type="text" maxlength="30" placeholder="Propietario (vacío = borrar)" aria-label="Propietario">
      <button type="submit">Guardar</button>
      <button type="button" class="sec" id="eCancelar">Cancelar</button>
    </form>
    <div id="fMsg"></div>
  </div>
</div>

<dialog id="dClave">
  <form id="fClave" method="dialog">
    <h2>Habilitar edición</h2>
    <input id="clave" type="password" autocomplete="current-password" placeholder="Contraseña" aria-label="Contraseña">
    <div id="dMsg"></div>
    <div class="acciones">
      <button type="button" class="sec" id="dCancelar">Cancelar</button>
      <button type="submit" id="dOk">Entrar</button>
    </div>
  </form>
</dialog>

<script src="config.js"></script>
<script src="lotes.js"></script>
<script src="lotes-magallanes.js"></script>
<script>
const DY = 7; // DY: del número de lote al centro del recuadro
// Barrios en un mismo lienzo: Villalobos arriba, Magallanes debajo (ox, oy: posición del plano en el lienzo)
const BARRIOS = {
  V: { nombre: 'Villalobos', img: 'mapa.jpg', w: 2000, h: 998, ox: 0, oy: 0, lotes: LOTES, geo: GEO, ceros: 0 },
  M: { nombre: 'Magallanes', img: 'mapa-magallanes.jpg', w: 1000, h: 1441, ox: 500, oy: 1068, lotes: LOTES_MAG, geo: GEO_MAG, ceros: 3 },
};
const W = 2000, H = BARRIOS.M.oy + BARRIOS.M.h;
const params = new URLSearchParams(location.search);
const EDITAR = params.has('editar');
const $ = id => document.getElementById(id);
const clave_ = (b, n) => b + '-' + n;
const numero = (b, n) => String(n).padStart(BARRIOS[b].ceros, '0'); // como figura en el plano
const posicion = (b, n) => { const B = BARRIOS[b], d = B.lotes[n]; return [B.ox + d[0], B.oy + d[1] + DY]; };

// Correcciones de posición hechas en modo edición (solo en este dispositivo)
let ajustes = {};
try { ajustes = JSON.parse(localStorage.getItem('ajustesLotes') || '{}'); } catch (e) {}
for (const k in ajustes) {
  const [b, n] = k.includes('-') ? k.split('-') : ['V', k]; // claves viejas: solo número = Villalobos
  const d = BARRIOS[b] && BARRIOS[b].lotes[n];
  if (d) { d[0] = ajustes[k][0]; d[1] = ajustes[k][1]; }
}

const visor = $('visor'), lienzo = $('lienzo'), marca = $('marca'), ficha = $('ficha'), input = $('lote');
lienzo.style.width = W + 'px';
lienzo.style.height = H + 'px';
for (const b in BARRIOS) {
  const B = BARRIOS[b], im = document.createElement('img');
  im.src = B.img; im.alt = 'Plano de ' + B.nombre;
  Object.assign(im.style, { left: B.ox + 'px', top: B.oy + 'px', width: B.w + 'px', height: B.h + 'px' });
  lienzo.prepend(im);
}
const titulo = document.createElement('div');
titulo.className = 'nombreBarrio';
titulo.textContent = 'MAGALLANES';
Object.assign(titulo.style, { left: BARRIOS.M.ox + 'px', width: BARRIOS.M.w + 'px', top: (BARRIOS.V.h + 8) + 'px' });
lienzo.appendChild(titulo);

let s = 1, tx = 0, ty = 0, actual = null; // actual = { b, n }
let filtro = 'T';
try { filtro = localStorage.getItem('filtroBarrio') || 'T'; } catch (e) {}
const barriosFiltro = () => filtro === 'T' ? Object.keys(BARRIOS) : [filtro];

// ---------- Propietarios (Google Sheets vía Apps Script) ----------
let PROP = { V: {}, M: {} };
let clave = null, apiV2 = false; // apiV2: el script ya guarda el barrio de cada lote
function normalizarProp(l) {
  if (!l) return { V: {}, M: {} };
  if (l.V || l.M) return { V: l.V || {}, M: l.M || {} };
  return { V: l, M: {} }; // formato anterior: solo Villalobos
}
try { PROP = normalizarProp(JSON.parse(localStorage.getItem('propietarios') || 'null')); } catch (e) {}
try { clave = sessionStorage.getItem('clave'); } catch (e) {}

function guardarPropLocal() { try { localStorage.setItem('propietarios', JSON.stringify(PROP)); } catch (e) {} }
function recibirProp(j) {
  apiV2 = j.v >= 2;
  PROP = normalizarProp(j.lotes);
  guardarPropLocal();
  dibujarEtiquetas();
}
async function cargarPropietarios() {
  if (!API_URL) return;
  try {
    const r = await fetch(API_URL, { cache: 'no-store' });
    const j = await r.json();
    if (j.ok) { recibirProp(j); if (actual) mostrar(actual.b, actual.n, false); }
  } catch (e) { /* sin conexión: quedan los datos guardados */ }
}
async function api(datos) {
  const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify(datos) }); // text/plain: sin preflight CORS
  return r.json();
}
function dibujarEtiquetas() {
  const cont = $('etiquetas');
  cont.textContent = '';
  for (const b in BARRIOS) for (const n in PROP[b]) {
    if (!BARRIOS[b].lotes[n]) continue;
    const [x, y] = posicion(b, n);
    const e = document.createElement('div');
    e.className = 'etiqueta';
    e.style.left = x + 'px';
    e.style.top = y + 'px';
    e.textContent = PROP[b][n];
    cont.appendChild(e);
  }
}
const normalizar = t => t.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();

// ---------- Mapa: zoom y desplazamiento ----------
function escalaMin() { return Math.min(visor.clientWidth / W, visor.clientHeight / H); }
function limitar() {
  const vw = visor.clientWidth, vh = visor.clientHeight;
  s = Math.max(escalaMin(), Math.min(s, 4));
  const w = W * s, h = H * s;
  tx = w <= vw ? (vw - w) / 2 : Math.min(0, Math.max(vw - w, tx));
  ty = h <= vh ? (vh - h) / 2 : Math.min(0, Math.max(vh - h, ty));
}
function aplicar(anim) {
  limitar();
  lienzo.classList.toggle('anim', !!anim);
  lienzo.style.transform = `translate(${tx}px, ${ty}px) scale(${s})`;
}
function verTodo(anim) { s = escalaMin(); aplicar(anim); }
function verBarrio(b, anim) {
  // Encuadra un barrio (o todo el lienzo con 'T')
  if (b === 'T') return verTodo(anim);
  const B = BARRIOS[b], vw = visor.clientWidth, vh = visor.clientHeight;
  s = Math.min(vw / B.w, vh / B.h) * 0.97;
  tx = vw / 2 - (B.ox + B.w / 2) * s;
  ty = vh / 2 - (B.oy + B.h / 2) * s;
  aplicar(anim);
}
function zoomEn(px, py, nuevo, anim) {
  const x = (px - tx) / s, y = (py - ty) / s;
  s = nuevo; limitar();
  tx = px - x * s; ty = py - y * s;
  aplicar(anim);
}
function centrarEn(x, y, escala) {
  s = escala;
  tx = visor.clientWidth / 2 - x * s;
  ty = visor.clientHeight * 0.42 - y * s;
  aplicar(true);
}

// ---------- Ficha del lote ----------
function mensajeFicha(t) { const m = $('fMsg'); m.textContent = t || ''; m.style.display = t ? 'block' : 'none'; }
function fichaError(titulo, texto) {
  actual = null;
  marca.classList.remove('on');
  ficha.className = 'on error';
  $('fNum').textContent = titulo;
  $('fDet').textContent = texto;
  $('btnEditar').style.display = 'none';
  $('btnLlegar').classList.remove('on');
  $('edicion').classList.remove('on');
  mensajeFicha('');
}
function mostrar(b, n, centrar) {
  const B = BARRIOS[b], d = B.lotes[n];
  $('edicion').classList.remove('on');
  mensajeFicha('');
  actual = { b, n: +n };
  const [x, y] = posicion(b, n);
  marca.style.left = x + 'px';
  marca.style.top = y + 'px';
  marca.classList.add('on');
  ficha.className = 'on';
  $('fNum').textContent = numero(b, n);
  const det = $('fDet');
  det.innerHTML = `<b>${B.nombre}</b> · ${d[2].toLocaleString('es-AR')} m²`;
  if (PROP[b][n]) {
    const p = document.createElement('div');
    p.id = 'fProp';
    p.textContent = PROP[b][n];
    det.appendChild(p);
  } else if (API_URL) {
    det.insertAdjacentHTML('beforeend', '<div>Sin propietario cargado</div>');
  }
  $('btnEditar').style.display = clave ? 'block' : 'none';
  const G = B.geo;
  const lat = G.lat[0] + G.lat[1] * d[0] + G.lat[2] * (d[1] + DY), lng = G.lng[0] + G.lng[1] * d[0] + G.lng[2] * (d[1] + DY);
  $('btnLlegar').href = `https://www.google.com/maps/dir/?api=1&destination=${lat.toFixed(6)},${lng.toFixed(6)}`;
  $('btnLlegar').classList.add('on');
  if (centrar) centrarEn(x, y, Math.max(escalaMin() * 3, 1.3));
}
function irALote(b, n) {
  input.value = numero(b, n);
  $('resultados').classList.remove('on');
  mostrar(b, n, true);
  history.replaceState(null, '', '#' + b + n);
}

// ---------- Búsqueda por número o por propietario ----------
function mostrarOpciones(lista, cabecera) {
  // lista: [{ b, n }]
  const r = $('resultados');
  r.textContent = '';
  const cab = document.createElement('div');
  cab.className = 'cab';
  cab.innerHTML = '<span></span><button type="button" aria-label="Cerrar">×</button>';
  cab.querySelector('span').textContent = cabecera;
  cab.querySelector('button').onclick = () => r.classList.remove('on');
  r.appendChild(cab);
  for (const { b, n } of lista) {
    const op = document.createElement('button');
    op.type = 'button';
    op.className = 'op';
    op.innerHTML = '<b></b><span class="barrio"></span><span class="prop"></span>';
    op.querySelector('b').textContent = numero(b, n);
    op.querySelector('.barrio').textContent = BARRIOS[b].nombre;
    op.querySelector('.prop').textContent = PROP[b][n] || '';
    op.onclick = () => irALote(b, n);
    r.appendChild(op);
  }
  r.classList.add('on');
}
$('buscar').addEventListener('submit', e => {
  e.preventDefault();
  const texto = input.value.trim();
  if (!texto) return;
  input.blur();
  $('resultados').classList.remove('on');
  const enDonde = filtro === 'T' ? 'ningún barrio' : BARRIOS[filtro].nombre;
  let lista;
  if (/^\d+$/.test(texto)) {
    const n = parseInt(texto, 10);
    lista = barriosFiltro().filter(b => BARRIOS[b].lotes[n]).map(b => ({ b, n }));
    if (lista.length === 1) return irALote(lista[0].b, n);
    if (lista.length > 1) return mostrarOpciones(lista, `El lote ${n} existe en ${lista.length} barrios`);
    return fichaError('Lote no encontrado', `No existe el lote ${n} en ${enDonde}.`);
  }
  const q = normalizar(texto);
  lista = [];
  for (const b of barriosFiltro()) for (const n in PROP[b]) if (normalizar(PROP[b][n]).includes(q)) lista.push({ b, n: +n });
  lista.sort((p, q2) => p.b.localeCompare(q2.b) * -1 || p.n - q2.n); // Villalobos primero
  if (lista.length === 1) return irALote(lista[0].b, lista[0].n);
  if (lista.length > 1) return mostrarOpciones(lista, `${lista.length} lotes coinciden con “${texto}”`);
  fichaError('Sin resultados', `Ningún propietario coincide con "${texto}"${filtro === 'T' ? '' : ' en ' + BARRIOS[filtro].nombre}.`);
});

// Selector de barrio
function marcarFiltro() {
  for (const b of $('filtro').children) b.classList.toggle('on', b.dataset.b === filtro);
}
for (const btn of $('filtro').children) btn.onclick = () => {
  filtro = btn.dataset.b;
  try { localStorage.setItem('filtroBarrio', filtro); } catch (e) {}
  marcarFiltro();
  $('resultados').classList.remove('on');
  verBarrio(filtro, true);
};

// ---------- Edición con contraseña ----------
function actualizarCandado() {
  const c = $('candado');
  c.textContent = clave ? '🔓' : '🔒';
  c.title = clave ? 'Salir de edición' : 'Habilitar edición';
  if (actual) mostrar(actual.b, actual.n, false);
}
$('candado').onclick = () => {
  if (clave) {
    clave = null;
    try { sessionStorage.removeItem('clave'); } catch (e) {}
    return actualizarCandado();
  }
  $('clave').value = '';
  $('dMsg').textContent = '';
  $('dClave').showModal();
};
$('dCancelar').onclick = () => $('dClave').close();
$('fClave').addEventListener('submit', async e => {
  e.preventDefault();
  const c = $('clave').value;
  if (!c) return;
  $('dOk').disabled = true;
  $('dMsg').textContent = 'Verificando…';
  try {
    const j = await api({ accion: 'verificar', clave: c });
    if (j.ok) {
      clave = c;
      try { sessionStorage.setItem('clave', c); } catch (x) {}
      $('dClave').close();
      actualizarCandado();
    } else $('dMsg').textContent = j.error || 'No se pudo verificar';
  } catch (x) {
    $('dMsg').textContent = 'Sin conexión con el servidor';
  }
  $('dOk').disabled = false;
});
$('btnEditar').onclick = () => {
  $('eProp').value = PROP[actual.b][actual.n] || '';
  $('edicion').classList.add('on');
  mensajeFicha('');
  $('eProp').focus();
};
$('eCancelar').onclick = () => { $('edicion').classList.remove('on'); mensajeFicha(''); };
$('edicion').addEventListener('submit', async e => {
  e.preventDefault();
  const { b, n } = actual, nombre = $('eProp').value.trim().slice(0, 30);
  // Con el script anterior (sin barrio) solo se puede guardar Villalobos, para no pisar lotes con el mismo número
  if (b !== 'V' && !apiV2) return mensajeFicha('Hay que actualizar el script de la planilla para guardar lotes de ' + BARRIOS[b].nombre + '.');
  const btn = e.target.querySelector('button[type=submit]');
  btn.disabled = true;
  mensajeFicha('Guardando…');
  try {
    const j = await api({ accion: 'guardar', clave, barrio: b, lote: n, propietario: nombre });
    if (j.ok) {
      recibirProp(j);
      mostrar(b, n, false);
    } else {
      mensajeFicha(j.error || 'No se pudo guardar');
      if (j.error === 'Contraseña incorrecta') { clave = null; try { sessionStorage.removeItem('clave'); } catch (x) {} actualizarCandado(); }
    }
  } catch (x) {
    mensajeFicha('Sin conexión: no se guardó');
  }
  btn.disabled = false;
});

// ---------- Controles ----------
$('mas').onclick = () => zoomEn(visor.clientWidth / 2, visor.clientHeight / 2, s * 1.6, true);
$('menos').onclick = () => zoomEn(visor.clientWidth / 2, visor.clientHeight / 2, s / 1.6, true);
$('todo').onclick = () => verBarrio(filtro, true);
$('verNombres').onclick = e => {
  const off = $('etiquetas').classList.toggle('off');
  e.currentTarget.classList.toggle('activo', !off);
};

// Pan, pellizco y toque con Pointer Events
const punteros = new Map();
let inicio = null, movido = false;
visor.addEventListener('pointerdown', e => {
  if (e.target.closest('button, input, #ficha, #resultados')) return;
  visor.setPointerCapture(e.pointerId);
  punteros.set(e.pointerId, { x: e.clientX, y: e.clientY });
  movido = false;
  inicio = estadoGesto();
});
visor.addEventListener('pointermove', e => {
  if (!punteros.has(e.pointerId)) return;
  punteros.set(e.pointerId, { x: e.clientX, y: e.clientY });
  const g = estadoGesto();
  if (!inicio || g.n !== inicio.n) { inicio = g; return; }
  if (Math.hypot(g.cx - inicio.cx, g.cy - inicio.cy) > 6 || g.n > 1) movido = true;
  if (!movido) return;
  const r = visor.getBoundingClientRect();
  const nuevaS = g.n > 1 ? inicio.s * g.dist / inicio.dist : s;
  // Punto del mapa bajo el centro inicial del gesto sigue al centro actual
  const mx = (inicio.cx - r.left - inicio.tx) / inicio.s, my = (inicio.cy - r.top - inicio.ty) / inicio.s;
  s = nuevaS;
  tx = g.cx - r.left - mx * s; ty = g.cy - r.top - my * s;
  aplicar(false);
  if (s !== nuevaS) inicio = estadoGesto(); // tope de zoom alcanzado
});
function fin(e) {
  if (!punteros.has(e.pointerId)) return;
  punteros.delete(e.pointerId);
  if (!movido && punteros.size === 0) toque(e.clientX, e.clientY);
  inicio = punteros.size ? estadoGesto() : null;
}
visor.addEventListener('pointerup', fin);
visor.addEventListener('pointercancel', fin);
function estadoGesto() {
  const p = [...punteros.values()];
  const cx = p.reduce((a, b) => a + b.x, 0) / (p.length || 1);
  const cy = p.reduce((a, b) => a + b.y, 0) / (p.length || 1);
  const dist = p.length > 1 ? Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y) : 1;
  return { n: p.length, cx, cy, dist, s, tx, ty };
}
visor.addEventListener('wheel', e => {
  if (e.target.closest('#resultados')) return;
  e.preventDefault();
  const r = visor.getBoundingClientRect();
  zoomEn(e.clientX - r.left, e.clientY - r.top, s * (e.deltaY < 0 ? 1.15 : 1 / 1.15), false);
}, { passive: false });

// Tocar el plano: lote más cercano de cualquier barrio (o mover el lote en modo edición)
function toque(cx, cy) {
  const r = visor.getBoundingClientRect();
  const x = (cx - r.left - tx) / s, y = (cy - r.top - ty) / s;
  if (EDITAR && actual) {
    const B = BARRIOS[actual.b], d = B.lotes[actual.n];
    d[0] = Math.round(x - B.ox); d[1] = Math.round(y - B.oy - DY);
    ajustes[clave_(actual.b, actual.n)] = [d[0], d[1]];
    try { localStorage.setItem('ajustesLotes', JSON.stringify(ajustes)); } catch (e) {}
    mostrar(actual.b, actual.n, false);
    dibujarEtiquetas();
    return;
  }
  let mejor = null, dMin = Infinity;
  for (const b in BARRIOS) for (const n in BARRIOS[b].lotes) {
    const [px, py] = posicion(b, n);
    const d = Math.hypot(px - x, py - y);
    if (d < dMin) { dMin = d; mejor = { b, n: +n }; }
  }
  if (mejor && dMin < 30) {
    input.value = numero(mejor.b, mejor.n);
    $('resultados').classList.remove('on');
    mostrar(mejor.b, mejor.n, false);
    history.replaceState(null, '', '#' + mejor.b + mejor.n);
  }
}

if (EDITAR) {
  $('editor').style.display = 'block';
  $('exportar').onclick = () => {
    const txt = JSON.stringify(ajustes);
    navigator.clipboard?.writeText(txt).then(() => alert('Copiado: ' + Object.keys(ajustes).length + ' ajustes'), () => prompt('Copiá esto:', txt));
  };
}
// ?todos: muestra todos los lotes (para revisar posiciones)
if (params.has('todos')) {
  for (const b in BARRIOS) for (const n in BARRIOS[b].lotes) {
    const [x, y] = posicion(b, n);
    const p = document.createElement('div');
    p.className = 'punto';
    p.style.left = x + 'px'; p.style.top = y + 'px';
    p.innerHTML = `<span>${numero(b, n)}</span>`;
    lienzo.appendChild(p);
  }
}

if (API_URL) {
  input.placeholder = 'N° de lote o propietario';
  $('ayuda').textContent = 'Tocá un lote o buscá por número o propietario';
  $('candado').style.display = 'block';
  $('verNombres').style.display = 'block';
  actualizarCandado();
  dibujarEtiquetas();
  cargarPropietarios();
} else {
  input.setAttribute('inputmode', 'numeric');
}
marcarFiltro();

window.addEventListener('resize', () => aplicar(false));
const img = lienzo.querySelector('img');
function arrancar() {
  verBarrio(filtro, false);
  // #V345, #M12 o #345 (formato anterior = Villalobos)
  const m = location.hash.match(/^#([VM]?)(\d+)$/);
  if (m) {
    const b = m[1] || 'V', n = parseInt(m[2], 10);
    if (BARRIOS[b].lotes[n]) { input.value = numero(b, n); mostrar(b, n, true); }
  }
}
img.complete ? arrancar() : img.addEventListener('load', arrancar);

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
